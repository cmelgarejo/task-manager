services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "3001:3001"
        environment:
            - NODE_ENV=development
        networks:
            - task-network

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - NEXT_PUBLIC_API_BASE_URL=http://backend:3001
        depends_on:
            - backend
        networks:
            - task-network

networks:
    task-network:
        driver: bridge
